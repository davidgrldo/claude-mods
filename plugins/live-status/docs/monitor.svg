  <rect class="chip" x="97" y="17" width="45" height="17" rx="8.5"/>
  <text class="chipt" x="119.5" y="29" text-anchor="middle" font-family="Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="9.5" font-weight="700" letter-spacing=".6">HIGH</text>
  <text class="mu" x="242" y="29" text-anchor="end" font-family="Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="600" font-variant-numeric="tabular-nums">$1.23</text>
  <rect class="lz-run" x="34" y="40" width="67" height="17" rx="8.5"/>
  <text class="lz-runt" x="67.5" y="52" text-anchor="middle" font-family="Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="9.5" font-weight="700" letter-spacing=".6">WORKING</text>
  
  <text class="mu" x="109" y="53" font-family="Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11">0:42 · 5 steps · 7 tools…</text>
</g>

<g>
  <text class="mu" x="264" y="27" font-family="Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="9.5" font-weight="700" letter-spacing=".9">CONTEXT</text>
  <text class="pc" x="371" y="27" text-anchor="end" font-family="Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="700" font-variant-numeric="tabular-nums">42%</text>
  <rect class="trk" x="264" y="33" width="107" height="6" rx="3"/>
