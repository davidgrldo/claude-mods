  <text class="mu" x="264" y="55" font-family="Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" font-variant-numeric="tabular-nums">420k of 1.0M</text>
</g>
<g>
  <text class="mu" x="389" y="27" font-family="Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="9.5" font-weight="700" letter-spacing=".9">5H<tspan class="lv-hi" dx="5">HIGH</tspan></text>
  <text class="pc" x="496" y="27" text-anchor="end" font-family="Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="700" font-variant-numeric="tabular-nums">68%</text>
  <rect class="trk" x="389" y="33" width="107" height="6" rx="3"/>
  <rect x="389" y="33" width="73" height="6" rx="3" fill="url(#gWarn)"/>
  <rect class="tick" x="480" y="32" width="1" height="8" rx=".5" opacity=".55"/>
  <text class="mu" x="389" y="55" font-family="Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" font-variant-numeric="tabular-nums">resets in 2h10m</text>
</g>
<g>
  <text class="mu" x="514" y="27" font-family="Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="9.5" font-weight="700" letter-spacing=".9">7D<tspan class="lv-bad" dx="5">CRIT</tspan></text>
  <text class="pc" x="621" y="27" text-anchor="end" font-family="Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="700" font-variant-numeric="tabular-nums">91%</text>
  <rect class="trk" x="514" y="33" width="107" height="6" rx="3"/>
  <rect x="514" y="33" width="97" height="6" rx="3" fill="url(#gBad)"/>
  
  <text class="mu" x="514" y="55" font-family="Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" font-variant-numeric="tabular-nums">resets in 4d3h</text>
</g>
<g>
  <text class="mu" x="639" y="27" font-family="Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="9.5" font-weight="700" letter-spacing=".9">RTK PROJECT</text>
  <text class="pc" x="746" y="27" text-anchor="end" font-family="Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="700" font-variant-numeric="tabular-nums">65%</text>
  <rect class="trk" x="639" y="33" width="107" height="6" rx="3"/>
  <rect x="639" y="33" width="70" height="6" rx="3" fill="url(#gDone)"/>
  
  <text class="mu" x="639" y="55" font-family="Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" font-variant-numeric="tabular-nums">572 saved · 8</text>
</g>



<clipPath id="rc"><rect x="14" y="70" width="732" height="2" rx="1"/></clipPath>
<rect class="rail" x="14" y="70" width="732" height="2" rx="1"/>
<g clip-path="url(#rc)"><rect x="14" y="70" width="205" height="2" rx="1" fill="url(#gRail)" style="animation:rl 1.8s cubic-bezier(.65,0,.35,1) infinite;animation-delay:-0.00s"/></g>
</svg>