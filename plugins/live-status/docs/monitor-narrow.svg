  <text class="pc" x="404" y="68" text-anchor="end" font-family="Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="700" font-variant-numeric="tabular-nums">91%</text>
  <rect class="trk" x="286" y="74" width="118" height="6" rx="3"/>
