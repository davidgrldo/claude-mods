</g>

<g>
  <text class="mu" x="14" y="118" font-family="Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="9.5" font-weight="700" letter-spacing=".9">TASK  Ship the redesign  ›  Test responsive</text>
  <text class="pc" x="406" y="118" text-anchor="end" font-family="Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="700" font-variant-numeric="tabular-nums">3/5  ·  60%</text>
